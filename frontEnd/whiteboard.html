<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Whiteboard</title>
    <style>
        body {
            background: bisque;
        }
        .centerer{
            display: flex;
            justify-content: center;
        }
    </style>
    <script src="fabric.min.js"></script>
    <script src="whiteboard.js"></script>
    <script>

        let boardId = -1;
        setTimeout(()=>{
            const urlParams = new URLSearchParams(window.location.search);
            boardId = urlParams.get('id');
            if(boardId == null){
                document.querySelector('.centerer').innerHTML = "Whiteboard not found!"
            } else {
                boardId = Number(boardId);
                init(document.querySelector('#canvas'))
                fetch("whiteboardContent?id=" + boardId).then(res => {
                    if (res.ok) {
                        res.json().then(data => {
                            loadCanvasFromData(data.items);
                            revision = data.revised;
                        });
                        setTimeout(updateLoop, 500)
                    } else {
                        console.error(res)
                    }
                })
            }
        },10)

    </script>
</head>
<body>
PLACEHOLDER TEXT
<div class="centerer">
    <div>
        <canvas id="canvas" width="1200" height="700"></canvas>
        <div class="toolbox centerer">
            <button id="selectButton" onclick="setMode('select')" disabled>Select</button>
            <button id="circleButton" onclick="setMode('circle')">Circle</button>
            <button id="lineButton" onclick="setMode('line')">Line</button>
            <button id="rectangleButton" onclick="setMode('rectangle')">Rectangle</button>
            <button id="ellipseButton" onclick="setMode('ellipse')">Ellipse</button>
            <button id="pathButton" onclick="setMode('path')">Path</button>
            <button id="deleteButton" onclick="setMode('delete')">Delete</button>
        </div>
    </div>
</div>


</body>
</html>
